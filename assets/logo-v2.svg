<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="200" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent2" x1="70" y1="40" x2="140" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="44" fill="url(#bg2)"/>

  <!-- Terminal window frame -->
  <rect x="32" y="38" width="136" height="124" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>

  <!-- Terminal title bar dots -->
  <circle cx="48" cy="52" r="4" fill="#ef4444" opacity="0.8"/>
  <circle cx="62" cy="52" r="4" fill="#eab308" opacity="0.8"/>
  <circle cx="76" cy="52" r="4" fill="#22c55e" opacity="0.8"/>

  <!-- Terminal line 1: prompt -->
  <text x="42" y="80" font-family="SF Mono,Menlo,monospace" font-size="11" fill="#64748b">$</text>
  <text x="54" y="80" font-family="SF Mono,Menlo,monospace" font-size="11" fill="#e2e8f0">codepliant go</text>

  <!-- Terminal line 2: checkmark result -->
  <text x="42" y="98" font-family="SF Mono,Menlo,monospace" font-size="11" fill="#22c55e">✓</text>
  <text x="56" y="98" font-family="SF Mono,Menlo,monospace" font-size="11" fill="#94a3b8">7 services</text>

  <!-- Terminal line 3: docs generated -->
  <text x="42" y="116" font-family="SF Mono,Menlo,monospace" font-size="11" fill="#22c55e">✓</text>
  <text x="56" y="116" font-family="SF Mono,Menlo,monospace" font-size="11" fill="#94a3b8">120+ docs</text>

  <!-- Terminal line 4: score -->
  <text x="42" y="134" font-family="SF Mono,Menlo,monospace" font-size="11" fill="#38bdf8">A</text>
  <text x="56" y="134" font-family="SF Mono,Menlo,monospace" font-size="11" fill="#94a3b8">100% score</text>

  <!-- Shield badge (bottom right corner, overlapping) -->
  <g transform="translate(138, 118)">
    <path d="M0 -22 L20 -12 L20 6 C20 16 12 24 0 28 C-12 24 -20 16 -20 6 L-20 -12 Z"
          fill="url(#accent2)" opacity="0.95"/>
    <path d="M-6 2 L-2 7 L8 -4" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
